name: urban-legend migration regression

on:
  push:
    branches:
      - "migration/**"
      - main
    paths:
      - ".github/workflows/migration-tests.yml"
      - "src/**"
      - "tests/**"
      - "migration/**"
      - "docs/10_each_lore/0000_tutorial/schemas/**"
      - "docs/00_research_overview/taxonomy_catalog.json"
      - "reviews/10_each_lore/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "migration/**"
      - "docs/10_each_lore/0000_tutorial/schemas/**"
      - "docs/00_research_overview/taxonomy_catalog.json"
      - "reviews/10_each_lore/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.0.3 jsonschema==4.25.1
      - name: Verify copied baseline and immutable legacy Reviews
        run: python -m src.migration.audit
      - name: Run regression tests
        run: python -m pytest -q tests
